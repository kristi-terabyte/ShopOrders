name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ShopOrders.sln

      - name: Build (Release)
        run: dotnet build ShopOrders.sln -c Release --no-restore -warnaserror

      - name: Test (Release)
        run: dotnet test ShopOrders.sln -c Release --no-build --verbosity normal
