name: ci

on:
  push:
    branches: [main, master, "feature/**", "lab07-tests", "lab6-refactoring", "lab02-code-style"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ShopOrders.sln

      - name: Build (Release)
        run: dotnet build ShopOrders.sln -c Release --no-restore -warnaserror

      - name: Test (Release)
        run: dotnet test ShopOrders.sln -c Release --no-build --verbosity normal

      - name: Coverage (ShopOrders.Core)
        run: |
          dotnet test tests/ShopOrders.Tests/ShopOrders.Tests.csproj -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
